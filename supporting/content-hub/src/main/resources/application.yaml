server:
  port: 8135

spring:
  application:
    name: ec-demo1-content-hub

  # content-hub's database lives on cp-postgres, the server with pgvector (the chat's RAG).
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/content_hub}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_SIZE:10}

  # Its own tables, additive only (schema.sql: "if not exists"); the outbox and inbox tables are the
  # messaging library's.
  sql:
    init:
      mode: always
      continue-on-error: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest

  # The newsletter, through the environment's relay (11-postfix.yaml).
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}

  ai:
    mcp:
      server:
        name: content-hub
        version: 1.0.0
        protocol: SSE

  # The MCP calls' tokens: Keycloak's keys over the cluster network, the issuer as the token says it.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.ec1.mateu.io/realms/ec-demo1}

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

# No security here, and none is missing: this pod is only reachable through the gateway, which
# requires a Keycloak token on /_intranet/** and sets X-User-Scopes from the users service — which
# decides who sees the "Editorial" backoffice (content:* permissions, @EyesOnly + EditorialIdentity).
# The media URLs it lets through unauthenticated carry a signature this service checks (MediaUrls).

messaging:
  outbox:
    interval: 1000ms
    continue-after-failure: true

content-hub:
  # Off the request's thread: publishing answers at once and the backoffice shows when it is applied.
  projection:
    async: ${PROJECTION_ASYNC:true}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  media:
    max-bytes: ${MEDIA_MAX_BYTES:20971520}
    # Signs the media URLs; one replica, so a random one at startup would do — set it to survive restarts.
    secret: ${MEDIA_SECRET:}
  embeddings:
    url: ${EMBEDDINGS_URL:http://embeddings}
    model: ${EMBEDDINGS_MODEL:intfloat/multilingual-e5-small}
  # The portal's search: a passage further than this (cosine distance) is no match by meaning.
  search:
    max-distance: ${SEARCH_MAX_DISTANCE:0.3}
    # «Respuesta de la IA»: the IA control plane's agent, over A2A, with the reader's token.
    agent-url: ${INTRANET_AGENT_URL:http://ia-agent:8095/a2a/intranet-agent}
    agent-timeout: ${INTRANET_AGENT_TIMEOUT:PT30S}
  # «Traducir con IA»: the same, with the editor's token.
  translation:
    agent-url: ${INTRANET_TRANSLATOR_URL:http://ia-agent:8095/a2a/intranet-translator}
    agent-timeout: ${INTRANET_TRANSLATOR_TIMEOUT:PT60S}
  # Optional: without a service account key file the Drive references work from the URL alone, with no metadata.
  drive:
    credentials-file: ${GOOGLE_DRIVE_CREDENTIALS_FILE:}
    impersonate: ${GOOGLE_DRIVE_IMPERSONATE:}
  newsletter:
    from: ${NEWSLETTER_FROM:intranet@ec1.mateu.io}
    # The demo's employees are made up: every newsletter goes here, saying whom it was for.
    redirect-to: ${NEWSLETTER_REDIRECT_TO:}
  portal-url: ${PORTAL_URL:http://ec1.localhost:8800/intranet}
  surveys:
    # Keys who answered an anonymous survey (with each survey's salt): set it, and the database alone
    # cannot tell whether someone answered. Changing it lets everyone answer the open ones once more.
    secret: ${SURVEY_SECRET:${MEDIA_SECRET:}}
  # What is published reaches its readers through communication-service (the bell, Web Push) and, if
  # important, by mail (the newsletter's relay and redirect, above).
  notifications:
    # Something that became effective longer ago than this, however it was missed, is no longer news.
    catch-up: ${NOTIFICATIONS_CATCH_UP:PT24H}
    reminder-before: ${NOTIFICATIONS_REMINDER_BEFORE:P2D}
    close-after: ${NOTIFICATIONS_CLOSE_AFTER:P30D}
    batch-size: ${NOTIFICATIONS_BATCH_SIZE:200}
  analytics:
    # How long raw usage events are kept; the daily figures stay. Never less than 30 days (the longest window).
    retention: ${ANALYTICS_RETENTION:P90D}
  seed:
    enabled: ${CONTENT_SEED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.apache.kafka: warn
