nodeSelector: { topology.kubernetes.io/region: hel1, kubernetes.io/arch: amd64 }
# Traces on a volume, as deployed: without this block a `deploy.sh` run would put Tempo back on an
# emptyDir and lose every trace on its next restart.
persistence:
  enabled: true
  size: 10Gi
  storageClassName: hcloud-volumes
tempo:
  # Grafana's Tempo datasource runs TraceQL with `rate() by(...)` for its service graph and RED
  # views, and those are computed by the metrics generator rather than read from the traces. With
  # it off — the chart's default — every one of those panels fails with
  #
  #   error finding generators: empty ring
  #
  # which says nothing about what is actually missing. Individual traces and search work fine
  # either way; it is only the aggregate views that need this.
  #
  # It writes the metrics it derives into Prometheus, which therefore has to accept remote writes
  # (enableRemoteWriteReceiver in the kube-prometheus-stack values).
  # Configuring the generator is only half of it: the processors also have to be switched on for
  # the tenant. Left at the chart's default (`overrides.defaults: {}`) the generator starts, its
  # config appears in the ConfigMap, and it receives nothing at all — a query then returns an empty
  # series rather than an error, which looks like "no data yet" and never stops looking like it.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks
          - service-graphs
          - span-metrics
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kps-kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write"
    processor:
      # local_blocks is what answers a TraceQL metrics query — anything with `| rate()`, which is
      # exactly what Grafana's trace views run. service_graphs and span_metrics feed the Prometheus
      # remote write instead, so with only those two the query stops failing and starts returning
      # an empty series, which is a different kind of confusing.
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
        max_block_duration: 1m
      service_graphs:
        wait: 10s
      span_metrics:
        dimensions: [service.name, span.name, status.code]
  # As long as the journey page looks back (JourneyProperties.lookback, 7 days; Tempo searches at
  # most 168 h) and as Loki keeps logs. The chart's default is 24h: a booking's journey vanished
  # the day after it was made, while the page still listed the booking.
  retention: 168h
  storage:
    trace: { backend: local }
  receivers:
    otlp:
      protocols:
        http: { endpoint: "0.0.0.0:4318" }
        grpc: { endpoint: "0.0.0.0:4317" }
  # 640Mi was enough for a Tempo that only ingested and read back traces. It is not enough for one
  # running the metrics generator above: `local_blocks` keeps recent spans in memory to answer the
  # TraceQL `| rate()` queries Grafana's trace views issue, and `filter_server_spans: false` means
  # it keeps the client spans too. Under a 5000-process load run with `TRACING_SAMPLING: "1.0"` on
  # all three engines it OOMKilled every ~70 seconds, and a Grafana query landing in one of those
  # windows reports `dial tcp ...:3200: connect: no route to host` — the pod is gone, so the
  # EndpointSlice has no backend. It reads like a network fault and is not one.
  resources:
    requests: { memory: 1Gi, cpu: 100m }
    limits: { memory: 3Gi, cpu: 1 }
# The chart's own config template, copied from tempo-1.24.4 with ONE line added:
# distributor.max_attribute_bytes. Tempo 2.9 truncates any span attribute longer than that — 2048
# bytes by default — silently, on ingestion. ia-agent writes the conversation onto its spans
# (IA_CAPTURE_CONTENT) with a limit of its own of 16384 characters and a note when it cuts, and a
# 2 KB Tempo limit would cut nearly every prompt and model reply before that note is reached.
# 65536 bytes is those 16384 characters at UTF-8's worst case, so Tempo never cuts first. The
# chart exposes no value for the distributor beyond its receivers, and Tempo no flag for this, so
# the template is the only place to say it. Everything else below renders exactly as before.
config: |
    memberlist:
      cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
    multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
    usage_report:
      reporting_enabled: {{ .Values.tempo.reportingEnabled }}
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention }}
    distributor:
      max_attribute_bytes: 65536
      receivers:
        {{- toYaml .Values.tempo.receivers | nindent 8 }}
    ingester:
      {{- toYaml .Values.tempo.ingester | nindent 6 }}
    server:
      {{- toYaml .Values.tempo.server | nindent 6 }}
    storage:
      {{- toYaml .Values.tempo.storage | nindent 6 }}
    querier:
      {{- toYaml .Values.tempo.querier | nindent 6 }}
    query_frontend:
      {{- toYaml .Values.tempo.queryFrontend | nindent 6 }}
    overrides:
      {{- toYaml .Values.tempo.overrides | nindent 6 }}
      {{- if .Values.tempo.metricsGenerator.enabled }}
    metrics_generator:
      {{- if .Values.tempo.metricsGenerator.processor }}
      processor:
        {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 8 }}
      {{- end }}
      {{- if .Values.tempo.metricsGenerator.registry }}
      registry:
        {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 8 }}
      {{- end }}
      storage:
        path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
        {{- if .Values.tempo.metricsGenerator.storage.remote_write }}
        remote_write:
          {{- toYaml .Values.tempo.metricsGenerator.storage.remote_write | nindent 10 }}
        {{- else }}
        remote_write:
          - url: {{ .Values.tempo.metricsGenerator.remoteWriteUrl }}
        {{- end }}
      traces_storage:
        path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
      {{- end }}
persistence:
  enabled: true
  storageClassName: hcloud-volumes
  size: 10Gi
