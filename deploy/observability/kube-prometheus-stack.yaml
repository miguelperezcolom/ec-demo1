# kube-prometheus-stack — metrics, and the Grafana everything else plugs into.
#
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#     -n observability -f deploy/observability/kube-prometheus-stack.yaml
# In hel1 with the rest of ec1, on whatever amd64 node Karpenter picks — a region, not an instance
# type. Until 2026-10-07 the stack was pinned to its own ccx23, kept off the engine's nodes for the
# load tests (a distinct instance type was the separation); that topology was retired on 2026-10-01,
# and the pin had left a dedicated-vCPU node in fsn1 (Hetzner had no ccx23 in hel1) costing ~86 €/month
# — almost half the cluster — plus a second load balancer, one per region with nodes, for nothing.
# A single-type pin also has no fallback when Hetzner runs out of that type in the region.
# Alertmanager: the alerts go to people, through communication-service — its recipients table says
# who, its inbox and Web Push are how (control-plane/communication-service, AlertmanagerWebhook). Only
# the rules labelled notify: ec-demo1 (prometheus-rules.yaml) are sent; the chart's own defaults —
# the always-firing Watchdog, the control-plane components a managed cluster does not expose — go to
# the null receiver. No ingress: nobody opens its UI from outside, and the webhook it calls is
# cluster-internal (the gateway routes nothing to /alerts).
#
# Its state (silences, the notification log) is on an emptyDir, like Prometheus' TSDB and for the same
# reason — the CSI refuses the operator's PVC. A restart forgets silences and may send a still-firing
# alert once more; communication-service dedupes it by the alert's fingerprint and start.
alertmanager:
  enabled: true
  ingress:
    enabled: false
  alertmanagerSpec:
    nodeSelector: { topology.kubernetes.io/region: hel1, kubernetes.io/arch: amd64 }
    retention: 120h
    resources:
      requests: { memory: "32Mi", cpu: "10m" }
      limits:   { memory: "128Mi" }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      # A firing alert already in someone's inbox is not news every hour: communication-service keeps
      # it open until it resolves. Four hours is how often an unattended one is sent again, deduped
      # there all the same.
      repeat_interval: 4h
      routes:
        - receiver: communication
          matchers: [ 'notify = "ec-demo1"' ]
    receivers:
      - name: "null"
      - name: communication
        webhook_configs:
          - url: http://communication-service.ec-demo1.svc.cluster.local:8125/alerts/alertmanager
            send_resolved: true
            max_alerts: 50
    # A critical alert silences the warnings of the same service: an Opera outage does not also send
    # "Opera fails a quarter of its calls".
    inhibit_rules:
      - source_matchers: [ 'severity = "critical"' ]
        target_matchers: [ 'severity = "warning"' ]
        equal: [ service ]

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# CloudFleet runs an admission policy that rejects — and its node autoprovisioner cannot size —
# pods whose containers declare no requests. Three of this chart's subcharts ship without them,
# so they are set here rather than left to default to BestEffort.
prometheus-node-exporter:
  # A DaemonSet, so no instance-type selector: it reports each node's own CPU, memory and disk,
  # and pinning it to the observability node would report that node four times over and nothing
  # about the ones under load.
  nodeSelector: { kubernetes.io/arch: amd64 }
  resources:
    requests: { memory: "32Mi", cpu: "20m" }
    limits:   { memory: "64Mi" }
kube-state-metrics:
  nodeSelector: { topology.kubernetes.io/region: hel1, kubernetes.io/arch: amd64 }
  resources:
    requests: { memory: "64Mi", cpu: "20m" }
    limits:   { memory: "128Mi" }

prometheusOperator:
  nodeSelector: { topology.kubernetes.io/region: hel1, kubernetes.io/arch: amd64 }
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }

prometheus:
  prometheusSpec:
    nodeSelector: { topology.kubernetes.io/region: hel1, kubernetes.io/arch: amd64 }
    retention: 24h
    scrapeInterval: 30s
    # Tempo's metrics generator derives service-graph and span metrics from traces and writes them
    # here. Without this the write is refused and Grafana's trace aggregate views stay broken even
    # once the generator itself is running.
    enableRemoteWriteReceiver: true
    # No storageSpec on purpose: Prometheus keeps its TSDB on an emptyDir here because the
    # Hetzner CSI rejects the PVC the operator writes ("invalid input in field 'labels'"), and
    # the pod then never starts. 24h of demo metrics do not survive a restart; Loki and Tempo,
    # whose PVCs the CSI does accept, are persistent.
    # Discover every ServiceMonitor/PodMonitor in the cluster, not only chart-labelled ones.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { memory: "640Mi", cpu: "250m" }
      limits:   { memory: "1536Mi", cpu: "1" }
    # Pods that carry prometheus.io/scrape: "true" — the shell — are scraped
    # without a ServiceMonitor each.
    additionalScrapeConfigs:
      - job_name: 'annotated-pods'
        kubernetes_sd_configs: [ { role: pod } ]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

grafana:
  nodeSelector: { topology.kubernetes.io/region: hel1, kubernetes.io/arch: amd64 }
  # No password in version control: the Secret is created at deploy time by deploy/deploy.sh.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # 512Mi is enough for Grafana rendering dashboards off Prometheus, and not enough for the same
  # Grafana running TraceQL `| rate()` queries against Tempo while a load run is in flight: it
  # OOMKilled twice doing exactly that, at a measured 685MB working set across the pod. The CPU
  # limit is raised with it because it was throttled 39% of periods in the same window — a Grafana
  # that cannot draw the panel is indistinguishable, from the browser, from a backend that is down.
  resources:
    requests: { memory: "256Mi", cpu: "200m" }
    limits:   { memory: "1Gi", cpu: "1" }
  # The dashboard/datasource sidecars ship with no requests either.
  sidecar:
    resources:
      requests: { memory: "64Mi", cpu: "20m" }
      limits:   { memory: "128Mi" }
  grafana.ini:
    server:
      root_url: https://grafana.ec1.mateu.io
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts: [grafana.ec1.mateu.io]
    path: /
    pathType: Prefix
    tls:
      - hosts: [grafana.ec1.mateu.io]
        secretName: grafana-tls
  additionalDataSources:
    - name: Loki
      # Explicit uid so the Tempo datasource below can point trace→logs navigation at it. Left
      # to Grafana the uid is generated, and tracesToLogsV2 then silently links to nothing.
      uid: loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      uid: tempo
      type: tempo
      # 3200, not 3100. Tempo's HTTP query API is on tempo-prom-metrics/3200; 3100 is Loki's port,
      # and a Tempo datasource pointed there answers 502 to every search — silently, because
      # Grafana only surfaces it when somebody opens the Explore tab and looks for a trace.
      url: http://tempo.observability.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
