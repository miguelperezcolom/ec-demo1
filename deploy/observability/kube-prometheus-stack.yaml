# kube-prometheus-stack — metrics, and the Grafana everything else plugs into.
#
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#     -n observability -f deploy/observability/kube-prometheus-stack.yaml
# Pinned to ccx33 (8 vCPU / 32 GB), which nothing in the ec-demo1 namespace requests. That is the
# separation: pod anti-affinity is namespace-scoped by default, so it cannot keep these pods off
# the engine's nodes from here — a distinct instance type can, and needs no rule on either side.
#
# One node for the whole stack rather than one each: Prometheus, Grafana, Loki and Tempo are the
# thing that has to keep working while the engine is being stressed, and what they must not share
# is the engine, not each other.
alertmanager:
  enabled: false

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# CloudFleet runs an admission policy that rejects — and its node autoprovisioner cannot size —
# pods whose containers declare no requests. Three of this chart's subcharts ship without them,
# so they are set here rather than left to default to BestEffort.
prometheus-node-exporter:
  # A DaemonSet, so no instance-type selector: it reports each node's own CPU, memory and disk,
  # and pinning it to the observability node would report that node four times over and nothing
  # about the ones under load.
  nodeSelector: { kubernetes.io/arch: amd64 }
  resources:
    requests: { memory: "32Mi", cpu: "20m" }
    limits:   { memory: "64Mi" }
kube-state-metrics:
  nodeSelector: { node.kubernetes.io/instance-type: ccx23 }
  resources:
    requests: { memory: "64Mi", cpu: "20m" }
    limits:   { memory: "128Mi" }

prometheusOperator:
  nodeSelector: { node.kubernetes.io/instance-type: ccx23 }
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }

prometheus:
  prometheusSpec:
    nodeSelector: { node.kubernetes.io/instance-type: ccx23 }
    retention: 24h
    scrapeInterval: 30s
    # Tempo's metrics generator derives service-graph and span metrics from traces and writes them
    # here. Without this the write is refused and Grafana's trace aggregate views stay broken even
    # once the generator itself is running.
    enableRemoteWriteReceiver: true
    # No storageSpec on purpose: Prometheus keeps its TSDB on an emptyDir here because the
    # Hetzner CSI rejects the PVC the operator writes ("invalid input in field 'labels'"), and
    # the pod then never starts. 24h of demo metrics do not survive a restart; Loki and Tempo,
    # whose PVCs the CSI does accept, are persistent.
    # Discover every ServiceMonitor/PodMonitor in the cluster, not only chart-labelled ones.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { memory: "640Mi", cpu: "250m" }
      limits:   { memory: "1536Mi", cpu: "1" }
    # Pods that carry prometheus.io/scrape: "true" — the worker and the shell — are scraped
    # without a ServiceMonitor each.
    additionalScrapeConfigs:
      - job_name: 'annotated-pods'
        kubernetes_sd_configs: [ { role: pod } ]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

grafana:
  nodeSelector: { node.kubernetes.io/instance-type: ccx23 }
  # No password in version control: the Secret is created at deploy time by deploy/deploy.sh.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # 512Mi is enough for Grafana rendering dashboards off Prometheus, and not enough for the same
  # Grafana running TraceQL `| rate()` queries against Tempo while a load run is in flight: it
  # OOMKilled twice doing exactly that, at a measured 685MB working set across the pod. The CPU
  # limit is raised with it because it was throttled 39% of periods in the same window — a Grafana
  # that cannot draw the panel is indistinguishable, from the browser, from a backend that is down.
  resources:
    requests: { memory: "256Mi", cpu: "200m" }
    limits:   { memory: "1Gi", cpu: "1" }
  # The dashboard/datasource sidecars ship with no requests either.
  sidecar:
    resources:
      requests: { memory: "64Mi", cpu: "20m" }
      limits:   { memory: "128Mi" }
  grafana.ini:
    server:
      root_url: https://grafana.ec1.mateu.io
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts: [grafana.ec1.mateu.io]
    path: /
    pathType: Prefix
    tls:
      - hosts: [grafana.ec1.mateu.io]
        secretName: grafana-tls
  additionalDataSources:
    - name: Loki
      # Explicit uid so the Tempo datasource below can point trace→logs navigation at it. Left
      # to Grafana the uid is generated, and tracesToLogsV2 then silently links to nothing.
      uid: loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      uid: tempo
      type: tempo
      # 3200, not 3100. Tempo's HTTP query API is on tempo-prom-metrics/3200; 3100 is Loki's port,
      # and a Tempo datasource pointed there answers 502 to every search — silently, because
      # Grafana only surfaces it when somebody opens the Explore tab and looks for a trace.
      url: http://tempo.observability.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
