# Alerts on the external APIs the platform spends: Salesforce's daily allowance (15,000 calls in a
# rolling 24 h on a Base Edition, shared by everyone on the org — ec1, any local stack with the same
# credentials, scripts, people) and Opera's rate (OHIP answers 429).
#
# The metrics are the services' own (Micrometer, scraped by the annotated-pods job):
#   salesforce_api_calls_total{purpose,outcome}   customer-mdm-service, one per call it makes
#   salesforce_org_api_used / _max                the org's total, as Salesforce last said it
#   salesforce_budget_paused                      1 while the MDM holds its calls (REQUEST_LIMIT_EXCEEDED)
#   opera_api_calls_total{service,purpose,outcome} pms-integration-service, one per call to OHIP
#
# `release: kps` is what the kube-prometheus-stack operator selects rules by (ruleSelector defaults to
# the chart's release label), as it does ServiceMonitors — see servicemonitors.yaml.
#
# Who hears of them: every rule here carries `notify: ec-demo1`, which is what Alertmanager routes to
# communication-service (kube-prometheus-stack.yaml, alertmanager.config); the chart's own default
# rules — the Watchdog, the control-plane components a managed cluster does not expose — go nowhere.
# communication-service turns a firing alert into an inbox notification (PLATFORM_ALERT, or
# PLATFORM_ALERT_CRITICAL for severity critical) for whoever its recipients table says, and closes it
# when the alert resolves. `link` is where to look.
#
# Tested with promtool: deploy/observability/prometheus-rules.test.yaml (see its header).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-apis
  namespace: observability
  labels: { release: kps }
spec:
  groups:
    - name: external-apis.salesforce
      rules:
        - alert: SalesforceAllowanceHigh
          expr: max(salesforce_org_api_used) / max(salesforce_org_api_max) >= 0.80
          for: 5m
          labels: { severity: warning, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "Salesforce org at {{ $value | humanizePercentage }} of its daily API allowance"
            description: >-
              The org's calls in the rolling 24 h are at 80% or more of its allowance. Check who spends
              them (dashboard External APIs: ours vs others) before the MDM has to pause.
        - alert: SalesforceAllowanceCritical
          expr: (max(salesforce_org_api_used) / max(salesforce_org_api_max) >= 0.95) or (max(salesforce_budget_paused) == 1)
          for: 1m
          labels: { severity: critical, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "Salesforce allowance at 95% or spent: the MDM holds its calls"
            description: >-
              At 95% of the org's daily allowance, or Salesforce already answers REQUEST_LIMIT_EXCEEDED
              and the MDM has paused its calls. Customers wait to be projected, merges and decisions to
              be read; nothing is lost. Look for another spender on the same org.
        - alert: SalesforceOurCallRateHigh
          expr: sum(rate(salesforce_api_calls_total{purpose!="token"}[1h])) * 86400 > 10000
          for: 15m
          labels: { severity: warning, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "The MDM is on course for {{ $value | humanize }} Salesforce calls a day"
            description: >-
              At the last hour's rate the MDM alone would spend more than 10,000 of the org's 15,000
              daily calls — a poll set too short, or a loop. See its calls by purpose.
        - alert: SalesforceOthersSpending
          expr: max(salesforce_org_api_used) - sum(increase(salesforce_api_calls_total{purpose!="token"}[24h])) > 5000
          for: 30m
          labels: { severity: warning, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "{{ $value | humanize }} of the org's Salesforce calls in 24 h are not ec1's MDM"
            description: >-
              Someone else on the same org is spending its allowance: a local stack with the same
              credentials (a 20 s merge poll once spent all of it), a script, another environment.
              Approximate: after a Prometheus restart the MDM's own increase is undercounted.
    - name: external-apis.opera
      rules:
        - alert: OperaThrottled
          expr: sum by (service) (increase(opera_api_calls_total{outcome="limited"}[15m])) > 0
          labels: { severity: warning, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "OHIP answered 429 to {{ $labels.service }}"
            description: >-
              Opera's gateway is throttling our calls: they are retried, but the service goes faster
              than OHIP allows. See the dashboard External APIs for which module.
        # 2026-09-29: OHIP UAT's reservations API answered 502, then 500 "downstream system", for
        # hours — token and configuration fine — and nobody knew until a user noticed a reservation
        # waiting. Every call failing while calls are being made is Opera down for us, whatever
        # status it answers with; the reservations keep waiting in the engine and go when it is back.
        - alert: OperaNotAnswering
          expr: >-
            sum by (service) (increase(opera_api_calls_total{outcome="error"}[10m])) > 5
            and on (service)
            sum by (service) (increase(opera_api_calls_total{outcome="ok",purpose!="token"}[10m])) == 0
          for: 10m
          labels: { severity: critical, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "Opera no responde a {{ $labels.service }}"
            description: >-
              Every call {{ $labels.service }} made to OHIP in the last 10 minutes failed (5xx, no
              answer): reservations and stays wait in the engine and go on their own when it answers
              again. If the token still works it is Oracle's side — open an incident with the tenant,
              the module and since when.
        - alert: OperaErrorRateHigh
          expr: >-
            sum by (service) (rate(opera_api_calls_total{outcome="error"}[15m]))
            / sum by (service) (rate(opera_api_calls_total[15m])) > 0.25
            and on (service) sum by (service) (increase(opera_api_calls_total[15m])) > 10
            and on (service) sum by (service) (increase(opera_api_calls_total{outcome="ok",purpose!="token"}[15m])) > 0
          for: 15m
          labels: { severity: warning, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "{{ $value | humanizePercentage }} of {{ $labels.service }}'s calls to OHIP fail"
            description: >-
              More than a quarter of the calls to Opera fail but some still go through: an OHIP module
              degraded, or one kind of request refused. See the dashboard External APIs by endpoint.
    - name: external-apis.salesforce-errors
      rules:
        - alert: SalesforceNotAnswering
          expr: >-
            sum(increase(salesforce_api_calls_total{outcome="error"}[15m])) > 3
            and sum(increase(salesforce_api_calls_total{outcome="ok"}[15m])) == 0
          for: 15m
          labels: { severity: critical, notify: ec-demo1 }
          annotations:
            link: https://console.ec1.mateu.io/_api-usage/apis
            summary: "Salesforce no responde al MDM"
            description: >-
              Every call the MDM made to Salesforce in the last 15 minutes failed (not the daily
              allowance — that is SalesforceAllowanceCritical): customers wait to be projected and
              change requests to be opened. Check the org and the MDM's credentials.
---
# The platform's own health: a service Prometheus scrapes stopped answering, or a pod of the demo is
# crash-looping. Same routing as the external APIs' (notify: ec-demo1).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ec-demo1-health
  namespace: observability
  labels: { release: kps }
spec:
  groups:
    - name: ec-demo1.health
      rules:
        - alert: ServiceDown
          expr: up{namespace="ec-demo1"} == 0
          for: 5m
          labels: { severity: critical, notify: ec-demo1 }
          annotations:
            link: https://grafana.ec1.mateu.io
            summary: "{{ $labels.pod }} no responde a Prometheus"
            description: >-
              Prometheus has not been able to scrape {{ $labels.pod }} ({{ $labels.job }}) for 5
              minutes: the pod is down, stuck or not ready. kubectl -n ec-demo1 describe pod
              {{ $labels.pod }}.
        - alert: PodCrashLooping
          expr: max by (pod, container) (kube_pod_container_status_waiting_reason{namespace="ec-demo1",reason="CrashLoopBackOff"}) == 1
          for: 5m
          labels: { severity: critical, notify: ec-demo1 }
          annotations:
            link: https://grafana.ec1.mateu.io
            summary: "{{ $labels.pod }} se reinicia en bucle"
            description: >-
              Container {{ $labels.container }} of {{ $labels.pod }} is in CrashLoopBackOff: it starts
              and dies. kubectl -n ec-demo1 logs {{ $labels.pod }} -c {{ $labels.container }} --previous.
