# CRS-PMS integration PoC (docs/poc-acl). The Opera end of the integration — the connector the PoC measures.
# The only piece that knows Opera's API (OHIP). No database: its state is Opera's and the engine's.
#
# How to reach each Opera property is not here: it is each hotel's integration's, registered in the
# console and read from integrations-service. In this PoC they point at opera-mock, with the
# double's fake credentials — nothing is written to a real Opera tenant.
#
# One replica: the read-compare-write of a reservation is serialised in memory, per reservation —
# the engine's LOCK step would be the place, and in 2.18.0 it does not work on PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-integration-service
  namespace: ec-demo1
  labels: { app: pms-integration-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pms-integration-service }
  template:
    metadata:
      labels:
        app: pms-integration-service
        app.kubernetes.io/component: pms-integration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8123"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: cx43
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/component, operator: Exists }
                  - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: pms-integration-service
          image: miguelperezcolom/ec-demo1-pms-integration-service:0.16.1
          env:
            - name: SERVER_PORT
              value: "8123"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            - name: CRS_INTEGRATION_URL
              value: "http://crs-integration-service:8121"
            - name: MAPPING_URL
              value: "http://mapping-service:8122"
            # No Opera connection here: each hotel's integration carries its own, read from
            # integrations-service. In this PoC they all point at opera-mock.
            - name: INTEGRATIONS_URL
              value: "http://integrations-service:8126"
            - name: RETRY_ALERT_AFTER
              value: "10m"
          ports:
            - { name: http, containerPort: 8123 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "100m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8123 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8123 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: pms-integration-service
  namespace: ec-demo1
  labels: { app: pms-integration-service }
spec:
  selector: { app: pms-integration-service }
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
