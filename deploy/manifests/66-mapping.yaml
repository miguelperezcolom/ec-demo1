# CRS-PMS integration PoC (docs/poc-acl). The integration's code mapping: the versioned dictionary with human
# approval, the causes processes wait on, the steps that prepare and resume a projection, the
# mapping agent's MCP tools, and its screens at /_mapping on the control console.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapping-service
  namespace: ec-demo1
  labels: { app: mapping-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mapping-service }
  template:
    metadata:
      labels:
        app: mapping-service
        app.kubernetes.io/component: mapping-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8122"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: cx43
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/component, operator: Exists }
                  - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: mapping-service
          image: miguelperezcolom/ec-demo1-mapping-service:0.15.1
          env:
            - name: SERVER_PORT
              value: "8122"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/mapping
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "6"
            - name: CRS_INTEGRATION_URL
              value: "http://crs-integration-service:8121"
            - name: PMS_INTEGRATION_URL
              value: "http://pms-integration-service:8123"
            - name: IA_AGENT_URL
              value: "http://ia-agent:8095"
            - name: CONSOLE_URL
              value: "https://console.ec1.mateu.io"
          ports:
            - { name: http, containerPort: 8122 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "100m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8122 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8122 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mapping-service
  namespace: ec-demo1
  labels: { app: mapping-service }
spec:
  selector: { app: mapping-service }
  ports:
    - { name: http, port: 8122, targetPort: 8122 }
