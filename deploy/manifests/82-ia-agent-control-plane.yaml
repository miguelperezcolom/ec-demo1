# The control plane's chat agent: the same ia-agent image as the console's (63-ia-agent.yaml), as a
# pod of its own whose agent is `control-plane-agent` — the assistant of the control console, whose
# MCP servers are what that console governs: integrations, mapping, the customer MDM,
# communication and the two engines (ec-ia-config: ia/agents/control-plane-agent.yaml). The
# gateway sends console.ec1's and rw-console.ec1's /ai/** here, behind ai-admin like the rest of
# that host.
#
# A pod rather than a routing rule, as for the front office (79-ia-agent-front-office.yaml): the
# control plane routes by the screen's route, and a route prefix cannot say which console a screen
# is on — its host does. The routing rules still apply first: from the mapping screens
# (mapping-screens-to-mapping-agent) the mapping agent answers, as on the data plane.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-agent-control-plane
  namespace: ec-demo1
  labels: { app: ia-agent-control-plane }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ia-agent-control-plane }
  template:
    metadata:
      labels:
        app: ia-agent-control-plane
        app.kubernetes.io/component: ia-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8095"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ia-agent
          image: miguelperezcolom/ec-demo1-ia-agent:0.16.0
          env:
            - name: SERVER_PORT
              value: "8095"
            - name: IA_CONTROL_PLANE_URL
              value: http://ia-control-plane:8110
            # Which agent this pod is: the control plane's, from the catalogue.
            - name: AGENT_ID
              value: control-plane-agent
            - name: OTEL_SERVICE_NAME
              value: ia-agent-control-plane
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            # A DEMO environment, as the console's agent: see 63-ia-agent.yaml before real data.
            - name: IA_CAPTURE_CONTENT
              value: full
          ports:
            - { name: http, containerPort: 8095 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "1024Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8095 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8095 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: ia-agent-control-plane
  namespace: ec-demo1
  labels: { app: ia-agent-control-plane }
spec:
  selector: { app: ia-agent-control-plane }
  ports:
    - { name: http, port: 8095, targetPort: 8095 }
