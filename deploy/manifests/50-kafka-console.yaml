# Redpanda Console — a window on the event stream.
#
# The engine is event-driven end to end: a process is created by a message on `upstream`, every
# state change is written to the outbox and relayed through `outbox`, and tasks are dispatched on
# `downstream` (people) and `work` (workers). When a process does not move, the question is always
# "did the message get produced, and did anyone consume it" — and that is exactly what this shows:
# topics, messages with their payloads, and consumer-group lag per partition.
#
# It is exposed on its own host rather than through the console gateway: it is not a Mateu app, so
# it cannot be a remote menu, and it has no business being behind the shell's path space.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
  namespace: ec-demo1
data:
  config.yaml: |
    kafka:
      brokers:
        - redpanda:19092
    server:
      listenPort: 8080
    # No schema registry and no admin API on purpose: neither is deployed here, and pointing
    # Console at an address that does not answer makes every page wait on a failing probe.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-console
  namespace: ec-demo1
  labels: { app: kafka-console }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-console }
  template:
    metadata:
      labels:
        app: kafka-console
        app.kubernetes.io/component: kafka-console
      annotations:
        # Rolls the pod when the config changes; a ConfigMap edit alone would leave the old file
        # mounted until something else happened to restart it.
        checksum/config: "brokers-redpanda-19092-v1"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: cx43
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/component, operator: Exists }
                  - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.10.0
          args: ["--config.filepath=/etc/console/config.yaml"]
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          volumeMounts:
            - { name: config, mountPath: /etc/console, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /admin/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /admin/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: config
          configMap: { name: redpanda-console-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-console
  namespace: ec-demo1
  labels: { app: kafka-console }
spec:
  selector: { app: kafka-console }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-console
  namespace: ec-demo1
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Basic auth, because Console's open-source build has no access control of its own: anyone who
    # reaches it can not only read every message but produce and delete them. The password is
    # generated by deploy.sh into deploy/.secrets/credentials.env.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: kafka-console-auth
    nginx.ingress.kubernetes.io/auth-realm: "Kafka console"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [kafka.ec1.mateu.io]
      secretName: kafka-console-tls
  rules:
    - host: kafka.ec1.mateu.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: kafka-console, port: { number: 8080 } } }
