# CRS-PMS integration PoC (docs/poc-acl), H13: the hotel's front office, brought from Mateu's demo —
# check-in, the in-house guests, check-out and folios. The integration writes into it every
# reservation of MRU01 it writes into Opera (pms-integration-service, write-front-office). Its UI at
# front.ec1.mateu.io, behind Keycloak; its /api only inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-office
  namespace: ec-demo1
  labels: { app: front-office }
spec:
  replicas: 1
  selector:
    matchLabels: { app: front-office }
  template:
    metadata:
      labels:
        app: front-office
        app.kubernetes.io/component: front-office
      annotations:
        # Karpenter does not move it to consolidate nodes: a restart under a demo is an outage.
        karpenter.sh/do-not-disrupt: "true"
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8128"
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: front-office
          image: miguelperezcolom/ec-demo1-front-office:0.41.0
          env:
            # Traces to Tempo: taking a stay from front-office-commands joins the trace of the booking
            # that wrote it into Opera.
            - name: OTEL_SERVICE_NAME
              value: front-office
            - name: OTLP_TRACING_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: TRACING_SAMPLING
              value: "1.0"
            - name: SERVER_PORT
              value: "8128"
            # The chain's MDM: the desk's changes to a guest go there, to be decided in Salesforce.
            # The CRS's adapter: a reservation whose guests all failed to arrive is reported there as a no-show.
            - name: CRS_INTEGRATION_URL
              value: "http://crs-integration-service:8121"
            - name: MDM_URL
              value: "http://customer-mdm-service:8127"
            - name: FRONT_OFFICE_HOTEL
              value: "MRU01"
            # The PMS property this front office consumes (pms-fo): its stays and catalogue come from
            # Opera XMAR, by Kafka (front-office-commands).
            - name: FRONT_OFFICE_PMS_HOTEL
              value: "XMAR"
            # The data plane's console: a stay links to its CRS booking and its customers (Clientes) there.
            - name: CONSOLE_URL
              value: "https://ec1.mateu.io"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/front_office
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "6"
            # The reception agent's actions are audited: to the `audit` topic, from an outbox. And it
            # consumes: the stays and catalogue of the PMS (front-office-commands), the MDM's customers.
            - name: KAFKA_BROKERS
              value: redpanda:19092
            - name: KEYCLOAK_ISSUER_URI
              value: https://auth.ec1.mateu.io/realms/ec-demo1
            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs
          ports:
            - { name: http, containerPort: 8128 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "640Mi", cpu: "500m" }
            limits:   { memory: "1536Mi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8128 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8128 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: front-office
  namespace: ec-demo1
  labels: { app: front-office }
spec:
  selector: { app: front-office }
  ports:
    - { name: http, port: 8128, targetPort: 8128 }
