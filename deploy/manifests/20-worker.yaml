# The test worker — a worker that does no work.
#
# Every ACTION step in every workflow here is answered by this one pod. It does not implement
# the steps: the process states what its tasks should do in a TEST_CONFIG variable and the
# worker plays that back, which is how the demo produces a timeout, an error or a saga rollback
# on demand without anyone writing a worker per scenario.
#
#   {"default":{"durationMs":200,"outcome":"COMPLETED"},
#    "tasks":{"charge-card":{"outcome":"ERROR","reason":"card declined"}}}
#
# It runs on `jpa` persistence, sharing the engine's database, so its two tables survive a
# restart and its UI at /_worker has a history to show. `SPRING_PROFILES_ACTIVE=memory` would
# drop the database entirely — the right shape for CI, the wrong one for something you demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ec-demo1
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
      # No prometheus.io/scrape here, unlike the shell and the gateway. The published
      # worker-standalone-app image carries actuator but not micrometer-registry-prometheus, so
      # /actuator/prometheus answers 404 — the endpoint does not exist without a registry on the
      # classpath. Annotating it anyway just produces a target that is permanently down, which is
      # worse than no target at all. Add the registry to the worker app upstream (the orchestrator
      # and forms images already have it) and this becomes three lines.
    spec:
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: worker
          image: miguelperezcolom/worker-standalone-app:2.2.1
          env:
            - name: SERVER_PORT
              value: "8091"
            - name: KAFKA_BROKERS
              value: redpanda:19092
            # One topic, and the default one: a step that names no topic goes to `downstream`,
            # which is every ACTION here and every USER_TASK that has not opted out. So this worker
            # answers the whole workflow by default, human tasks included — which is what you want
            # for a definition under test.
            #
            # The forms engine used to share this topic, and that does not work: the two are in
            # different consumer groups, so both received every message and the worker answered the
            # human tasks itself. It now listens on `forms` instead (see deploy/values/
            # eventconductor.yaml), and a USER_TASK reaches it only by naming `topic: forms`.
            - name: SPRING_CLOUD_STREAM_BINDINGS_CONSUMEWORKEREVENT_IN_0_DESTINATION
              value: "downstream"
            # jpa, and not by preference: `memory` does not start on 2.2.1. The profile excludes
            # DataSourceAutoConfiguration, but ReceivedTaskEntityRepository and
            # TaskOverrideEntityRepository are plain JpaRepository interfaces with no condition on
            # them, so Spring Data scans them anyway, finds no entityManagerFactory and the context
            # fails to refresh. No amount of spring.autoconfigure.exclude fixes that from outside —
            # the repositories themselves have to become conditional.
            #
            # The cost is that the handler's blocking store calls run on Reactor threads under load,
            # which is the trade its own javadoc calls acceptable "because the work it is
            # interleaved with is a delay". With JPA it is interleaved with a database write.
            - name: WORKER_PERSISTENCE
              value: jpa
            # The worker owns its two tables outright and ships no migrations, so it creates
            # them itself rather than validating against someone else's history.
            - name: DDL_AUTO
              value: update
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/workflow
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-postgres, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_SIZE
              value: "8"
            # How long a task takes when the scenario does not say. Kept short so a process
            # walked through by hand does not feel stuck.
            - name: WORKER_TASK_DURATION
              value: 2s
          ports:
            - { name: http, containerPort: 8091 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "448Mi", cpu: "150m" }
            limits:   { memory: "1Gi",   cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8091 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8091 }
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: ec-demo1
  labels: { app: worker }
spec:
  selector: { app: worker }
  ports:
    - { name: http, port: 8091, targetPort: 8091 }
