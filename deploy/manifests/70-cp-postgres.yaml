# A second PostgreSQL, for the control plane alone, on a volume that survives its pod.
#
# The engine's PostgreSQL is on an `emptyDir` — `postgres.localDisk: true` in
# deploy/values/eventconductor.yaml — because local NVMe is what decides how fast a WAL commit can
# fsync, and that number is what this whole deployment exists to measure. The price is that the
# data dies with the pod, and that is the right trade for an engine schema, a test worker's task
# log and three demo services' rows.
#
# It is the wrong trade for this one. The control plane holds the catalogue of MCP servers, the
# agents composed from it, the encrypted API keys the chat panel spends money with, and — since
# retrieval — whatever has been ingested into a RAG source that points here. Losing that
# on a pod restart would make the console worse than the YAML file it replaces — the point of
# moving configuration into a UI is that it stays put.
#
# Flipping the engine's own `localDisk` to false would have solved it in one line and slowed the
# measured path for everything. A second database, 2Gi, on the same `hcloud-volumes` storage class
# Redpanda already uses, does not.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cp-postgres
  namespace: ec-demo1
  labels: { app: cp-postgres }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hcloud-volumes
  resources:
    requests:
      # The four catalogues are tens of rows. This is almost entirely WAL and headroom — Hetzner's
      # smallest volume is 10Gi anyway, so asking for less buys nothing.
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-postgres
  namespace: ec-demo1
  labels: { app: cp-postgres }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a ReadWriteOnce volume cannot be attached to two pods, so a
  # rolling update deadlocks with the new pod Pending forever on a volume the old one still holds.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: cp-postgres }
  template:
    metadata:
      labels:
        app: cp-postgres
        app.kubernetes.io/component: cp-postgres
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: cx43
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/component, operator: Exists }
                  - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          # postgres:16 with the pgvector extension available to be created — the same server,
          # plus one extension. It is here rather than in a vector store of its own because the
          # RAG catalogue's connection URLs point wherever they like: this is the store this
          # deployment happens to provide, not one the design depends on.
          #
          # It means configuration tables and document vectors share a database. For a demo that
          # is the right size; the day the vectors are large enough to matter, a source pointed
          # somewhere else is a field in the console and no code at all.
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: ec-cp-postgres, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: ec-cp-postgres, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ec-cp-postgres, key: POSTGRES_PASSWORD } }
            # The mount point itself is not empty on a fresh volume — it has lost+found — and
            # initdb refuses a non-empty directory. A subdirectory is the standard way round it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "1Gi",   cpu: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
          readinessProbe:
            exec: { command: ["pg_isready", "-q"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec: { command: ["pg_isready", "-q"] }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cp-postgres
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cp-postgres
  namespace: ec-demo1
  labels: { app: cp-postgres }
spec:
  selector: { app: cp-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
