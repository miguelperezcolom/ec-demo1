# CRS-PMS integration PoC (docs/poc-acl). A double of Opera's OHIP Property APIs, standing in for a real
# tenant: the connector writes here, and /_opera-mock shows what "reached Opera". State in memory —
# a restart empties "Opera", which the integration's order guard and upserts are built to survive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opera-mock
  namespace: ec-demo1
  labels: { app: opera-mock }
spec:
  replicas: 1
  selector:
    matchLabels: { app: opera-mock }
  template:
    metadata:
      labels:
        app: opera-mock
        app.kubernetes.io/component: opera-mock
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8124"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: cx43
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/component, operator: Exists }
                  - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: opera-mock
          image: miguelperezcolom/ec-demo1-opera-mock:0.19.0
          env:
            - name: SERVER_PORT
              value: "8124"
          ports:
            - { name: http, containerPort: 8124 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "1Gi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8124 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8124 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: opera-mock
  namespace: ec-demo1
  labels: { app: opera-mock }
spec:
  selector: { app: opera-mock }
  ports:
    - { name: http, port: 8124, targetPort: 8124 }
