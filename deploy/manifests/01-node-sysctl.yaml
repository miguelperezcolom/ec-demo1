# Raises fs.inotify.max_user_instances on every node.
#
# The kernel default is 128, which is what these nodes boot with, and it is far too low for a
# Kubernetes node. Every container that watches files takes one instance — a ConfigMap or Secret
# projection, Alloy tailing each pod's logs, Grafana's dashboard sidecars, Loki, Prometheus — and
# when they run out `inotify_init` returns EMFILE, which surfaces in logs as the thoroughly
# misleading **"too many open files"**. Nothing is out of file descriptors; the process asked for
# an inotify instance and the node had none left to give.
#
# This belongs in the NodeClass, so every node boots with it. CloudFleet does not allow editing
# NodeClasses or NodePools with kubectl ("must be managed via the Cloudfleet Fleet API"), so it
# lives here instead — a DaemonSet, which is also what makes it apply to nodes Karpenter has not
# provisioned yet.
#
# Only `max_user_instances` is raised. `max_user_watches` is already scaled to node memory here
# (29k on the smallest, 121k on the largest) and each watch costs kernel memory, so raising it
# without a symptom pointing at it would be spending RAM against a guess.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sysctl
  namespace: kube-system
  labels: { app: node-sysctl }
spec:
  selector:
    matchLabels: { app: node-sysctl }
  template:
    metadata:
      labels: { app: node-sysctl }
    spec:
      # Every node, including control-plane and any node carrying a taint this cluster uses —
      # a node the DaemonSet skips is a node that keeps the broken limit.
      tolerations:
        - operator: Exists
      # The privileged work happens here and then is over. The container that stays running for
      # the DaemonSet's sake has no privileges at all.
      initContainers:
        - name: set-sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              before=$(cat /proc/sys/fs/inotify/max_user_instances)
              if [ "$before" -lt 1024 ]; then
                echo 1024 > /proc/sys/fs/inotify/max_user_instances
              fi
              echo "fs.inotify.max_user_instances: $before -> $(cat /proc/sys/fs/inotify/max_user_instances)"
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "32Mi" }
      containers:
        # Does nothing, on purpose. A DaemonSet needs a container that stays up; the work was the
        # init container's, and a pod that exited would be restarted forever instead.
        - name: pause
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { memory: "8Mi", cpu: "5m" }
            limits:   { memory: "32Mi" }
