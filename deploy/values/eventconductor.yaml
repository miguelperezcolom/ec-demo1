# EventConductor for the ec-demo1 deployment (CloudFleet / Hetzner), sized to be stressed.
#
#   helm upgrade --install ec deploy/chart/eventconductor -n ec-demo1 \
#     -f deploy/values/eventconductor.yaml
#
# ── The topology, and why ─────────────────────────────────────────────────────
# Five node groups, each on hardware chosen for what it does. Separation is enforced by pod
# anti-affinity on `app.kubernetes.io/component`, not by hope: an instance-type selector alone
# lets Karpenter pack two components onto one node the moment they both fit.
#
#   postgres      ccx13   2 vCPU / 8 GB   alone, local NVMe
#   orchestrator  ccx13   2 vCPU / 8 GB   alone
#   worker        ccx13   2 vCPU / 8 GB   alone       (deploy/manifests/20-worker.yaml)
#   platform      cx43    8 vCPU          redpanda, forms, rules, keycloak, shell, gateway, console
#   observability ccx23   4 vCPU / 16 GB  its own namespace, its own instance type
#
# One 8-vCPU node for the whole platform group rather than several small ones: they fit together,
# and the fleet's cpu limit is the binding constraint — 3x2 + 8 + 4, plus a small node for the
# ingress controller, is 20 of 24.
#
# cx43 and not ccx33: this fleet's catalogue has no ccx33 at all. Karpenter answers a request for
# one with "no instance type met all requirements" and creates nothing, which reads exactly like a
# quota problem and is not — probe a type with a throwaway pod before designing around it. The
# shared-vCPU line is the right trade here anyway: nothing in this group blocks on fsync the way
# PostgreSQL does, which is what the dedicated vCPU is bought for.
#
# CCX rather than CX: dedicated vCPU. On the shared-vCPU line an fsync syscall is stalled by
# noisy-neighbour CPU steal, which is exactly the syscall a WAL commit blocks on — the engine's
# throughput ceiling is a database durability ceiling before it is anything else.
#
# CloudFleet does not allow creating NodePools with kubectl ("must be managed via the Cloudfleet
# Fleet API"), so the instance type is requested per pod and Karpenter provisions it off the
# existing unrestricted pool. That pool's own cpu limit is the real budget: this topology asks for
# 18 vCPU of node, plus whatever the ingress controller sits on.

## ── PostgreSQL ───────────────────────────────────────────────────────────────
postgres:
  image: postgres:16
  database: workflow
  username: workflow
  existingSecret: ec-postgres
  # Local NVMe. See the note on this key in the chart's values.yaml — the data does not survive
  # the pod, which is the trade this deployment is explicitly making.
  localDisk: true
  maxConnections: 400
  nodeSelector:
    node.kubernetes.io/instance-type: ccx13
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              # Exists AND NotIn, deliberately. `NotIn` alone also matches pods that do not carry
              # the label at all — every DaemonSet on the node — and the rule would then exclude
              # every node in the cluster and schedule nothing.
              - { key: app.kubernetes.io/component, operator: Exists }
              - { key: app.kubernetes.io/component, operator: NotIn, values: [postgres] }
          topologyKey: kubernetes.io/hostname
  resources:
    requests: { memory: "3Gi", cpu: "1" }
    limits:   { memory: "6Gi" }

## ── Redpanda ─────────────────────────────────────────────────────────────────
redpanda:
  image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
  brokerInternal: redpanda:19092
  cores: 2
  # Six, matching upstream and outbox, so the orchestrator can be scaled without repartitioning.
  defaultTopicPartitions: 6
  storage: 16Gi
  storageClass: hcloud-volumes
  externalNodePort: null
  nodeSelector:
    node.kubernetes.io/instance-type: cx43
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: Exists }
              - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
          topologyKey: kubernetes.io/hostname
  resources:
    requests: { memory: "2Gi", cpu: "500m" }
    limits:   { memory: "4Gi",  cpu: "2" }

## ── Orchestrator ─────────────────────────────────────────────────────────────
orchestrator:
  image: miguelperezcolom/orchestrator-standalone-app
  imageTag: "2.10.2"
  replicas: 1
  servicePort: 8105
  # The engine owns its schema now. It always could — the image ships flyway-core and
  # flyway-database-postgresql — and with these two lines the other way round it did not: Hibernate
  # built the tables, no migration ever ran, and the engine said so at every startup ("its
  # migrations were not applied, so the database may be missing the engine's indexes"). It was
  # right. Every index that lives only in SQL was absent, including the two that 2.6.0 added for
  # the listings, and they had to be applied by hand.
  #
  # Turning this on required emptying the schema first: Flyway will not adopt tables it did not
  # create, and baselining would have meant declaring a Hibernate-built schema equivalent to
  # migration history it never ran. The database here is disposable by design — it lives on an
  # emptyDir — so dropping it was cheaper than pretending. Keycloak is untouched, it has its own
  # database on the same server.
  ddlAuto: none
  flywayEnabled: true
  # Six partitions on each binding, one pod: three threads leaves half of them unread.
  consumerConcurrency: 6
  dbPoolSize: 64
  # Fifteen minutes, not two. A deadline starts when the step starts, and under a burst a step
  # spends nearly all of it queued — sizing this against what the worker simulates (200ms) put
  # 13537 steps into TIMEOUT and took 4722 of 5000 processes to ERROR. It has to sit above the
  # worst queueing delay you are willing to absorb, not above the work itself.
  defaultStepTimeoutMs: 900000
  security:
    enabled: false
  extraEnv:
    WORKFLOW_GITIMPORT_REPOSITORIES_0_URL: "https://github.com/miguelperezcolom/ec-definitions.git"
    WORKFLOW_GITIMPORT_REPOSITORIES_0_BRANCH: "master"
    WORKFLOW_GITIMPORT_REPOSITORIES_0_DIRECTORY: "definitions/workflows"
    OTLP_TRACING_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318/v1/traces"
    TRACING_SAMPLING: "1.0"
    # Without this every span arrives as "unknown_service" and the three engines are
    # indistinguishable in Tempo. Boot does not map spring.application.name onto the OTel
    # resource here, and OTEL_SERVICE_NAME is the standard way to say it.
    OTEL_SERVICE_NAME: "orchestrator"
    # JGit writes a user config as it clones, and this pod has a read-only root filesystem where
    # only /tmp is writable — without this every import logs two ERROR lines about a lock file.
    XDG_CONFIG_HOME: "/tmp"
    # ── The outbox relay, which is what actually caps throughput here ────────────
    # Defaults are a 500ms poll of at most 100 rows by one thread: 200 events/s, whatever the
    # hardware. Measured on a pure-orchestration workflow that never touches a worker, this
    # deployment sat at 94 transitions/s with the orchestrator at 46% CPU, PostgreSQL idle and
    # 7335 rows waiting in the outbox — a queue in front of an engine that had capacity to spare.
    #
    # The poll interval is the cost of an empty pass, so lowering it costs a query against an
    # indexed range when there is nothing to do. relay-concurrency is bounded by design — the
    # claim holds row locks for the length of its transaction — so it is raised deliberately, not
    # to the maximum, and it wants connections: keep dbPoolSize above it plus the consumers.
    # relay-concurrency stays at 4, and 2.8.0 is the release that made that a measurement rather
    # than an inheritance.
    #
    # 2.8.0 runs the relay's sends on virtual threads and defaults this to 0 — one per partition key
    # in the batch, no cap. The expectation was that removing the cap would lift the ceiling, since
    # a blocking send per message means the producer never holds more than relay-concurrency records
    # and amortises its round trip across four of them instead of across the batch.
    #
    # It did not, here. A/B on this deployment, same engine, same database, capped run taken on the
    # larger table of the two so the bias runs against it:
    #
    #     uncapped (default 0)    65-72 transitions/s
    #     capped at 4             95-103 transitions/s
    #
    # Do not read that as "the cap wins". The comparison is not sound and the mechanism offered for
    # it was wrong. batch-size is a LIMIT on the claim, not a threshold to fill: the relay takes up
    # to 500 pending rows and sends however many it finds. Pending sat at 3 during the uncapped run
    # and 0 at the end of the capped one, so batches were a few rows either way and concurrency had
    # almost nothing to bite on — a cap cannot explain 35% when the relay is not the constraint in
    # either arm. The uncapped samples were also still climbing when they were taken (0.93, 4.63,
    # 11.24, 9.32, 10.32) while the capped ones were flat (14.77, 13.72, 13.57): a ramp measured
    # against a plateau. Redpanda sat at 0.16 of 2 cores throughout, as it has in every measurement
    # here.
    #
    # 4 is kept because it is what this deployment has always run and nothing has been shown to beat
    # it — not because the A/B above showed anything. Redoing it properly means equal elapsed time
    # per arm, a plateau confirmed on both, and the outbox retention below set first, so the arms do
    # not sit on a table that grew by 75 000 rows between them.
    #
    # Removing it did move the bottleneck, which is worth recording: the outbox stopped backing up
    # entirely (3 rows pending, 29ms relay passes) and PostgreSQL became the busiest component at
    # 0.502 cores against the orchestrator's 0.384. Whatever caps this deployment now, it is not the
    # relay. See the note on outbox retention below.
    #
    # What has not changed: the send is still synchronous in the sense that matters — a refusal is
    # knowable and an unacked row stays Pending. That is what the outbox is for, and it is what an
    # asynchronous send once cost, losing 71 of 642 912 messages during a ninety-second outage.
    #
    # Not set, and it should be: workflow.outbox.retention. Sent rows are never deleted without it,
    # and this database is at 1 020 435 outbox rows / 516 MB after two days of load runs. The engine
    # warns that the failure mode is "invisible at sixty thousand rows, which is where every
    # measurement so far has been taken", and that it is felt as a table autovacuum has to keep
    # rewriting rather than as a slow query. That matches PostgreSQL being the busiest thing here.
    WORKFLOW_OUTBOX_POLL_INTERVAL_MS: "50"
    WORKFLOW_OUTBOX_BATCHSIZE: "500"
    WORKFLOW_OUTBOX_RELAYCONCURRENCY: "0"
    # Sent rows are kept for a day and then deleted, in bounded repeated batches. Without this the
    # property has no default and nothing is ever removed: this database reached 1 315 832 rows and
    # 516 MB in a morning of load runs. Only Sent rows older than the window go — a Pending row is
    # undelivered work and an Error row is parked for a human, and both outlive any retention.
    #
    # It is not retroactive relief for a table that is already large: every row here was written
    # after this morning's schema rebuild, so none is older than 24h and the first passes delete
    # nothing. It stops the growth from here on, which is the point.
    WORKFLOW_OUTBOX_RETENTION: "24h"
    # How many of a poll batch's per-process groups one consumer thread may work at once.
    #
    # The default is 1, which ties in-pod parallelism to the partition count: six partitions, six
    # threads, six processes in flight — and with a transition costing ~37ms of mostly waiting,
    # that is a ceiling of roughly 160/s no matter how idle the CPU is. Raising the relay alone
    # drained the outbox from 7335 rows to 12 and left throughput where it was, which is what
    # pointed here.
    #
    # The groups are independent by construction — distinct processes, distinct rows — so this
    # changes nothing about ownership or ordering. It does take a JDBC connection per busy thread:
    # keep dbPoolSize above concurrency x parallelism plus the relay and the scanner.
    WORKFLOW_CONSUMER_PROCESSPARALLELISM: "8"
  extraEnvFromSecret: ec-git-webhook
  nodeSelector:
    node.kubernetes.io/instance-type: ccx13
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: Exists }
              - { key: app.kubernetes.io/component, operator: NotIn, values: [orchestrator] }
          topologyKey: kubernetes.io/hostname
  resources:
    requests: { memory: "2Gi", cpu: "1" }
    limits:   { memory: "5Gi", cpu: "2" }
  podDisruptionBudget:
    enabled: false

## ── Forms ────────────────────────────────────────────────────────────────────
forms:
  image: miguelperezcolom/forms-standalone-app
  imageTag: "2.10.2"
  replicas: 1
  servicePort: 8106
  # The engine owns its schema now. It always could — the image ships flyway-core and
  # flyway-database-postgresql — and with these two lines the other way round it did not: Hibernate
  # built the tables, no migration ever ran, and the engine said so at every startup ("its
  # migrations were not applied, so the database may be missing the engine's indexes"). It was
  # right. Every index that lives only in SQL was absent, including the two that 2.6.0 added for
  # the listings, and they had to be applied by hand.
  #
  # Turning this on required emptying the schema first: Flyway will not adopt tables it did not
  # create, and baselining would have meant declaring a Hibernate-built schema equivalent to
  # migration history it never ran. The database here is disposable by design — it lives on an
  # emptyDir — so dropping it was cheaper than pretending. Keycloak is untouched, it has its own
  # database on the same server.
  ddlAuto: none
  flywayEnabled: true
  security:
    enabled: false
  extraEnv:
    FORMS_GITIMPORT_REPOSITORIES_0_URL: "https://github.com/miguelperezcolom/ec-definitions.git"
    FORMS_GITIMPORT_REPOSITORIES_0_BRANCH: "master"
    # Ignored on 2.2.1: `directory` exists on the workflow engine's GitImportProperties and not on
    # the forms engine's, so this is accepted by relaxed binding and does nothing. The import walks
    # the whole clone and warns on every file that is not a form. Kept so it starts working the day
    # the field is added upstream.
    FORMS_GITIMPORT_REPOSITORIES_0_DIRECTORY: "definitions/forms"
    OTLP_TRACING_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318/v1/traces"
    TRACING_SAMPLING: "1.0"
    OTEL_SERVICE_NAME: "forms"
    XDG_CONFIG_HOME: "/tmp"
    # A topic of its own. On the default `downstream` the forms engine and the test worker both
    # receive every task — different consumer groups — and the worker answers the human ones
    # itself. Here a USER_TASK reaches the forms engine only by naming `topic: forms`.
    SPRING_CLOUD_STREAM_BINDINGS_CONSUMEWORKEREVENTFORFORMSENGINE_IN_0_DESTINATION: "forms"
  extraEnvFromSecret: ec-git-webhook
  nodeSelector:
    node.kubernetes.io/instance-type: cx43
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: Exists }
              - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
          topologyKey: kubernetes.io/hostname
  resources:
    requests: { memory: "1Gi", cpu: "500m" }
    limits:   { memory: "2Gi", cpu: "2" }
  podDisruptionBudget:
    enabled: false

## ── Rules ────────────────────────────────────────────────────────────────────
# Running now, and reading from the same repository. It has nothing to import yet — ec-definitions
# carries no definitions/rules directory — so it will start, clone, find no rules and say so. That
# is the honest state: the engine is there and wired, the catalogue is empty.
rules:
  image: miguelperezcolom/rule-standalone-app
  imageTag: "2.10.2"
  replicas: 1
  servicePort: 8107
  grpcEnabled: false
  # The engine owns its schema now. It always could — the image ships flyway-core and
  # flyway-database-postgresql — and with these two lines the other way round it did not: Hibernate
  # built the tables, no migration ever ran, and the engine said so at every startup ("its
  # migrations were not applied, so the database may be missing the engine's indexes"). It was
  # right. Every index that lives only in SQL was absent, including the two that 2.6.0 added for
  # the listings, and they had to be applied by hand.
  #
  # Turning this on required emptying the schema first: Flyway will not adopt tables it did not
  # create, and baselining would have meant declaring a Hibernate-built schema equivalent to
  # migration history it never ran. The database here is disposable by design — it lives on an
  # emptyDir — so dropping it was cheaper than pretending. Keycloak is untouched, it has its own
  # database on the same server.
  ddlAuto: none
  flywayEnabled: true
  security:
    enabled: false
  extraEnv:
    RULES_GITIMPORT_REPOSITORIES_0_URL: "https://github.com/miguelperezcolom/ec-definitions.git"
    RULES_GITIMPORT_REPOSITORIES_0_BRANCH: "master"
    RULES_GITIMPORT_REPOSITORIES_0_DIRECTORY: "definitions/rules"
    OTLP_TRACING_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318/v1/traces"
    TRACING_SAMPLING: "1.0"
    OTEL_SERVICE_NAME: "rules"
    XDG_CONFIG_HOME: "/tmp"
  extraEnvFromSecret: ec-git-webhook
  nodeSelector:
    node.kubernetes.io/instance-type: cx43
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: Exists }
              - { key: app.kubernetes.io/component, operator: In, values: [postgres, orchestrator, worker] }
          topologyKey: kubernetes.io/hostname
  resources:
    requests: { memory: "1Gi", cpu: "500m" }
    limits:   { memory: "2Gi", cpu: "2" }
  podDisruptionBudget:
    enabled: false

# Ingress is not the chart's: this deployment fronts several hosts from one controller, so it is
# written out in deploy/manifests/40-ingress.yaml.
ingress:
  enabled: false

networkPolicy:
  enabled: false
