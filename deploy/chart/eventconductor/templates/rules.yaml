## ── Rules Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventconductor.fullname" . }}-rules
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: rules
spec:
  replicas: {{ .Values.rules.replicas }}
  # Recreate, not the default RollingUpdate: replicas is 1 and the cx43 nodepool runs near-full,
  # so a rolling update's surge pod cannot schedule (Pending, "Insufficient memory") and the
  # rollout stalls with the old pod still serving. Recreate terminates the old pod first — a few
  # seconds of downtime, no surge. It used to live only as a live `kubectl patch`; baking it in
  # keeps it through a fresh `helm install` too.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rules
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rules
    spec:
      {{- with (default .Values.nodeSelector (get .Values "rules").nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (get .Values "rules").affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: rules
          image: "{{ .Values.rules.image }}:{{ default .Chart.AppVersion .Values.rules.imageTag }}"
          imagePullPolicy: {{ .Values.rules.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.rules.port }}
            - containerPort: {{ .Values.rules.grpcPort }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.rules.port | quote }}
            - name: RULES_GRPC_ENABLED
              value: {{ .Values.rules.grpcEnabled | quote }}
            - name: RULES_GRPC_PORT
              value: {{ .Values.rules.grpcPort | quote }}
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BROKERS
              value: {{ .Values.redpanda.brokerInternal }}
            - name: DDL_AUTO
              value: {{ .Values.rules.ddlAuto | quote }}
            - name: FLYWAY_ENABLED
              value: {{ .Values.rules.flywayEnabled | quote }}
            # The engine applies its own migrations and records them here. Baselining at 0
            # so V1 is applied even though the schema is not empty — the three apps share
            # one database, so "not empty" means somebody else got here first — is now the
            # engine's own behaviour and no longer needs to be configured per deployment.
            - name: RULES_SCHEMA_TABLE
              value: {{ .Values.rules.flywayTable | quote }}
            - name: SECURITY_ENABLED
              value: {{ .Values.rules.security.enabled | quote }}
            - name: SECURITY_USER
              value: {{ .Values.rules.security.user | quote }}
            {{- if .Values.rules.security.passwordSecret }}
            - name: SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rules.security.passwordSecret }}
                  key: SECURITY_PASSWORD
            {{- end }}
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            {{- range $k, $v := .Values.rules.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.rules.extraEnvFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.rules.extraEnvFromSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.rules.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.rules.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            # Kubernetes defaults timeoutSeconds to 1, and one second is not a health check on a
            # JVM — it is a check that the JVM is idle. A single expensive request is enough to put
            # the actuator endpoint past it; /workflow/analytics did exactly that here and the
            # liveness probe SIGKILLed a pod that was working, not stuck.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.rules.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
            # Liveness restarts the container, so it has to mean "wedged", never "busy". Five
            # seconds to answer and six consecutive misses is two minutes of silence before a kill.
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
---
## ── Rules Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: rules
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: rules
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rules
  ports:
    - name: http
      port: {{ .Values.rules.servicePort }}
      targetPort: {{ .Values.rules.port }}
    - name: grpc
      port: {{ .Values.rules.grpcPort }}
      targetPort: {{ .Values.rules.grpcPort }}
{{- if .Values.rules.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eventconductor.fullname" . }}-rules
spec:
  minAvailable: {{ .Values.rules.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rules
{{- end }}
