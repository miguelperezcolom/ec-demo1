spring.application.name=ec-demo1-front-office
mateu.debug=false
# The tests on in-memory H2, as the demo ran. CASE_INSENSITIVE_IDENTIFIERS: Spring Data JDBC quotes
# derived identifiers in upper case ("GUEST") but explicit @Table values as-is.
spring.datasource.url=jdbc:h2:mem:frontoffice;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
