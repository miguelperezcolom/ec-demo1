server:
  port: 8122

spring:
  application:
    name: ec-demo1-mapping

  ai:
    mcp:
      server:
        name: mapping
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    function:
      definition: consumeWorkerEvent;consumeMappingCommands
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
          # A binding asking for more partitions than its topic has (consumeWorkerEvent's concurrency)
          # grows the topic: partitions are only ever added.
          auto-add-partitions: true
          # Every consumer continues the trace its record carries (traceparent header), and every
          # record sent carries the trace it was sent in: the engine's tasks run inside the process's
          # trace.
          enable-observation: true
        bindings:
          outboxUpstream:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          notifications:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          audit:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          resolutions:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        # IN: the engine's tasks for the mapping — the steps whose definition says topic mapping, or
        # whose task contract does. consumeWorkerEvent is the engine's worker runtime (worker-kafka):
        # it runs each task by its contract, <id>@<version>, on the handler registered for it
        # (worker.MappingTasks), and answers the engine. The group is the one the hand-written
        # consumer had, so it goes on from the same offsets.
        consumeWorkerEvent-in-0:
          destination: mapping
          group: ec-demo1-mapping-worker
          consumer:
            # Three at a time: every reservation's projection goes through here and its steps wait
            # on the CRS and the integrations service; one thread would queue a backfill behind each call. The topic is grown
            # to three partitions (auto-add-partitions, above). What must not run at once is kept
            # apart by the engine's LOCK on the reservation, not by the partition.
            concurrency: 3
        # IN: what other services ask of the mapping without waiting — the integrations service's
        # equivalences, the agent's proposal, causes to resolve, partners' PMS profiles. Taken once
        # each (inbox); retried until it goes.
        consumeMappingCommands-in-0:
          destination: mapping-commands
          group: ec-demo1-mapping-commands
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # OUT: replies to the engine; and, through the outbox, the messages that resume waiting
        # processes, the starts of their successors, and notifications.
        upstream:
          destination: upstream
        outboxUpstream:
          destination: upstream
        notifications:
          destination: notifications
        # OUT, through the outbox: every auditable action a person takes here (HLA F016).
        audit:
          destination: audit
        # OUT, through the outbox: what a notification asked for is no longer waiting — the inbox closes it.
        resolutions:
          destination: notification-resolutions

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/mapping}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

mapping:
  crs-integration-url: ${CRS_INTEGRATION_URL:http://localhost:8121}
  pms-integration-url: ${PMS_INTEGRATION_URL:http://localhost:8123}
  integrations-url: ${INTEGRATIONS_URL:http://localhost:8126}
  ia-agent-url: ${IA_AGENT_URL:http://localhost:8095}
  console-url: ${CONSOLE_URL:https://console.ec1.mateu.io}
  resend-after: 30s

springdoc:
  packages-to-scan: io.mateu.ecdemo1.mapping.rest

management:
  # Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in
  # the cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
