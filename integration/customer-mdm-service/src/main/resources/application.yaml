server:
  port: 8127

spring:
  application:
    name: ec-demo1-customer-mdm

  ai:
    mcp:
      server:
        name: customer-mdm
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/customer_mdm}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}

  # OUT, through the outbox: what the MDM tells whoever holds a copy of a customer — the front
  # office's kardex and Opera's guest profiles are kept by subscribers (pms-integration,
  # crs-integration), not called from here. Synchronous, so a message is marked published only once
  # the broker acknowledged it; keyed by the customer.
  cloud:
    function:
      # consumeWorkerEvent: the engine's tasks (worker-kafka) — the demo's reset, worker.MdmTasks.
      definition: consumeCustomerCommands;consumeWorkerEvent
    stream:
      kafka:
        binder:
          # Consumers continue the trace their record carries; records sent carry the trace they were sent in.
          enable-observation: true
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
        bindings:
          customers:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          notifications:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          resolutions:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          customerNotices:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        customers:
          destination: customers
        # OUT, through the outbox: a person told of what only a person can see to — Salesforce's daily
        # API allowance spent — and, when it is over, the notice closed in every inbox.
        notifications:
          destination: notifications
        resolutions:
          destination: notification-resolutions
        # OUT, through the outbox: a customer's reception notices as Salesforce (their master)
        # confirmed them, whole, keyed by the customer — the front office shows them at the desk.
        customerNotices:
          destination: customer-notices
        # IN: what the hotels tell the MDM without waiting — a change the desk made to a customer, a
        # document it scanned. Taken once each (inbox); retried until it goes.
        consumeCustomerCommands-in-0:
          destination: customer-commands
          group: ec-demo1-customer-mdm-commands
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000
        # IN: the engine's tasks for the MDM — the steps of reset-demo that name the topic customer-mdm.
        # Never paused by the reset it runs (demo-reset keeps it); consumeCustomerCommands is.
        consumeWorkerEvent-in-0:
          destination: customer-mdm
          group: ec-demo1-customer-mdm-worker
        # OUT: the replies to the engine.
        upstream:
          destination: upstream

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

# Salesforce is off unless its connection is given: the MDM still resolves identities and serves the
# sale without it — cleaning just waits (HLA: Salesforce is a worker; if it is down, cleaning queues).
mdm:
  salesforce:
    domain: ${SF_DOMAIN:}
    client-id: ${SF_CLIENT_ID:}
    client-secret: ${SF_CLIENT_SECRET:}
    api-version: ${SF_API_VERSION:v67.0}
    pubsub-host: ${SF_PUBSUB_HOST:api.pubsub.salesforce.com}
    pubsub-port: ${SF_PUBSUB_PORT:7443}
    subscribe: ${SF_SUBSCRIBE:true}
  projection-tick: ${PROJECTION_TICK:5s}
  # The nets under Salesforce's Pub/Sub events, which are what bring merges, decisions and notices
  # (gRPC to api.pubsub.salesforce.com:7443, resumed from the replay id kept in salesforce_cursor;
  # Pub/Sub does not spend the daily API allowance — its events count against the event delivery
  # allocation instead). A query each, out of the org's daily API allowance (15,000 calls in a rolling
  # 24 h on a Base Edition), so once a day — and at once when a subscription starts without a replay id.
  poll: ${CONSOLIDATION_POLL:24h}
  change-poll: ${CHANGE_POLL:24h}
  # Reception notices asked for in the Clientes console: written to Salesforce every tick while any
  # waits (one call for the new ones, one for the rest); their event confirms them, and the daily poll
  # asks only for the ones written and still not confirmed.
  notice-tick: ${NOTICE_TICK:5s}
  notice-poll: ${NOTICE_POLL:24h}
  # How old the org's API total may get before one /limits call asks for it (the consoles' header).
  usage-limits-stale: ${USAGE_LIMITS_STALE:2h}
  # How each contact is marked — Estado MDM, Calidad del dato, Origen: sent with every projection, and
  # every marking-tick for the contacts whose marking changed alone (one call per 200; none if none did).
  marking-tick: ${MARKING_TICK:2m}
  # Data minimisation: «Solo nombre» contacts whose customer has only cancelled or no-show bookings are
  # anonymised in Salesforce after this long without activity (daily, at the cron's time).
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}
    after: ${CLEANUP_AFTER:30d}
    cron: ${CLEANUP_CRON:0 30 3 * * *}
  # When Salesforce answers REQUEST_LIMIT_EXCEEDED, every call pauses this long, doubled on each
  # refusal after that up to the longest; one inbox notice says so, and it closes when calls go again.
  salesforce-pause: ${SALESFORCE_PAUSE:5m}
  salesforce-pause-max: ${SALESFORCE_PAUSE_MAX:60m}
  # Where a customer's reservations are read from, for the data plane's Clientes screens, and where a
  # person opens each system. Read-only; a system that does not answer leaves its part empty.
  links:
    booking-url: ${BOOKING_URL:http://localhost:8108}
    front-office-url: ${FRONT_OFFICE_URL:}
    front-office-public-url: ${FRONT_OFFICE_PUBLIC_URL:https://front.ec1.mateu.io}
    # Blank: derived from SF_DOMAIN (acme.my.salesforce.com is opened as acme.lightning.force.com).
    salesforce-url: ${SF_LIGHTNING_URL:}
    timeout: ${LINKS_TIMEOUT:3s}

springdoc:
  packages-to-scan: io.mateu.ecdemo1.mdm.rest

management:
  # Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in
  # the cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
