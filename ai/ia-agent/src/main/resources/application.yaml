server:
  port: 8095

spring:
  application:
    name: ec-demo1-ia-agent

  threads:
    virtual:
      enabled: true

  autoconfigure:
    exclude:
      # Spring AI's Anthropic auto-configuration builds one AnthropicApi and one
      # AnthropicChatModel at startup, from spring.ai.anthropic.* properties. This service has no
      # such properties any more: the model and the credential arrive per prompt from the control
      # plane, and ChatClientRegistry builds a client per credential. Left enabled, it would
      # either fail for a missing api-key or — worse — supply a second, stale ChatClient bean that
      # nothing means to use.
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

  ai:
    mcp:
      client:
        # Off, and now for a second reason on top of the original one. The original: Spring AI's
        # auto-configured client holds one persistent SSE connection and stays broken for the life
        # of the pod once it drops, so PerRequestMcpClientFactory opens a fresh set per prompt.
        # The new one: there is no static list to configure it from — which servers this agent
        # reaches is the control plane's answer, and it can change between two prompts.
        enabled: false

    # Observations of the model and its tools. The spans and the gen_ai.* metrics are on as soon
    # as the ObservationRegistry reaches the chat models — ChatClientRegistry passes it, since it
    # builds them itself.
    #
    # Spring AI's own CONTENT switches stay off whatever ia.observability.capture-content says, and
    # that is not a contradiction. In 2.0.1, log-prompt / log-completion (chat and chat client) and
    # include-error-logging only ever write to the LOG — Loki, not the span — and
    # tools.observations.include-content does put a tool's arguments and result on the span, but
    # raw: neither redacted nor truncated. The content that reaches a span goes through one place
    # instead, ContentCapture, which applies the mode below to all of it: the user's message and
    # the answer, the messages sent to the model and its reply, and each tool's arguments and result.
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    tools:
      observations:
        include-content: false

ia:
  # The two things this pod knows about itself. Everything else — model, credential, system
  # prompt, MCP servers — comes from the control plane at /internal/agents/{agent-id}/config.
  control-plane:
    url: ${IA_CONTROL_PLANE_URL:http://localhost:8110}
  agent-id: ${AGENT_ID:console-agent}
  # Agent-to-agent. Every pod serves every agent of the catalogue at /a2a/{agentId} (card at
  # /a2a/{agentId}/.well-known/agent-card.json, JSON-RPC message/send on POST), and calls the peers
  # the control plane lists for an agent as tools — see io.mateu.ecdemo1.iaagent.a2a.
  a2a:
    # What the Agent Card says this service's A2A address is. The control plane builds its peers'
    # URLs from its own cp.a2a-base-url; the two should agree.
    base-url: ${IA_A2A_BASE_URL:http://ia-agent:8095}
    # Hops of agent-calls-agent after a person's prompt: 2 lets A ask B and B ask C, and no further.
    max-depth: ${IA_A2A_MAX_DEPTH:2}
    # Per call, and it includes the other agent's whole turn — its model and its tools.
    timeout-seconds: ${IA_A2A_TIMEOUT_SECONDS:120}
    # message/send needs the caller's bearer token, forwarded by the calling agent.
    require-token: ${IA_A2A_REQUIRE_TOKEN:true}
  observability:
    # What the traces keep of the conversation — see ContentCapture:
    #   none      no content: tokens, durations, tools and outcomes only (the default)
    #   redacted  the content, with e-mails, phones, cards, IBANs, DNI/NIE and passports masked
    #   full      the content as it is
    # Anything but none puts customer data in Tempo for as long as Tempo keeps traces.
    capture-content: ${IA_CAPTURE_CONTENT:none}
    # Per attribute, in characters; longer values are cut and say so. Tempo's distributor has its
    # own limit (max_attribute_bytes, raised to match in deploy/observability/tempo.yaml) and
    # truncates silently past it.
    max-attribute-length: ${IA_CAPTURE_MAX_CHARS:16384}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # A deliberate divergence from the other services here, and the only one: this pod can be UP
      # while serving a configuration from an hour ago, and without details that is
      # indistinguishable from UP. The distinction is the whole point of the indicator.
      #
      # It is safe because this endpoint is not reachable from outside the cluster: the gateway
      # routes /ai/** to this service and nothing else, so /actuator on either host lands on a
      # shell's catch-all. What the details contain is an agent id and a connection error.
      show-details: always
      group:
        # Readiness follows the configuration: a pod that has never reached the control plane has
        # no model and no tools, and taking it out of the Service's endpoints is more useful than
        # letting it answer every prompt with an error.
        readiness:
          include: readinessState, agentConfiguration
        # Liveness deliberately does NOT include it. Liveness restarts the container, and
        # restarting because another service is unreachable fixes nothing and throws away the
        # cached configuration that was keeping this pod working.
        liveness:
          include: livenessState

  # Traces, to Tempo, the same way the engines send theirs. Sampling is 0 unless TRACING_SAMPLING
  # says otherwise, so a laptop without a collector exports nothing and logs nothing about it.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  # Under this name and no other: Boot 4 deprecated management.otlp.tracing.endpoint at level
  # ERROR, so it is no longer bound — set there, it reads back fine and no exporter is created.
  # The service name comes from OTEL_SERVICE_NAME, set in the manifest.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    # Buckets, so the dashboard can take a p50/p95 of them. Without these a timer is exported as
    # count, sum and max only, and a percentile of that does not exist.
    distribution:
      percentiles-histogram:
        gen_ai.client.operation: true
        spring.ai.tool: true
        ia.agent.prompt: true

logging:
  level:
    org.springframework.ai: WARN
    io.mateu.ecdemo1: INFO
