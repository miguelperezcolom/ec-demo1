server:
  port: 8110

spring:
  application:
    name: ec-demo1-ia-control-plane

  datasource:
    # Its own PostgreSQL, not the engine's. The engine's is on an emptyDir and dies with the pod,
    # which is the right trade for a load rig and the wrong one for the only copy of this
    # deployment's LLM credentials — see deploy/manifests/70-cp-postgres.yaml.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/controlplane}
    username: ${DB_USERNAME:controlplane}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_SIZE:8}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

cp:
  # Seeded once, only onto a control plane whose four catalogues are all empty — see
  # CatalogueSeeder. It is what keeps `deploy.sh` producing a console whose chat panel works,
  # now that the agent takes its configuration from here instead of from its own properties.
  seed:
    agent-id: ${SEED_AGENT_ID:console-agent}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    orchestrator-url: ${ORCHESTRATOR_URL:}
    forms-url: ${FORMS_URL:}
    booking-url: ${BOOKING_URL:}
    # Where a seeded RAG source points. This deployment's own cp-postgres, which carries the
    # pgvector extension — but a source can point anywhere, and this one is only a starting point.
    rag-url: ${RAG_STORE_URL:}

  crypto:
    # 32 bytes, base64, from the ec-cp-crypto secret. Unset is a legible failure rather than a
    # silent one: the service starts, the catalogues work, and only the credential field refuses.
    #
    # Rotating it makes every stored credential undecryptable — there is no re-wrapping here, so
    # rotation means entering the keys again.
    key: ${CP_CRYPTO_KEY:}

  # GitOps: the catalogues as YAML in a GitHub repo, this control plane reconciling to match.
  #
  # Git owns only what git created. Each entry the reconciler writes is recorded as git-managed; an
  # entry removed from the repo is deleted here only if it is git-managed. Anything created in the
  # console is invisible to this — never overwritten, never deleted by a sync — and can only be
  # removed from the console. The console stays a real editor, for trying a configuration out or a
  # quick fix, not a viewer.
  #
  # Sync is driven by the webhook — a real push — not by a clock. The periodic poll is off by
  # default precisely so a console edit is not reverted between pushes; turn it on only if you want
  # drift corrected without waiting for the next push, and accept that it re-asserts the repo.
  #
  # Secrets never live in the repo. An LLM entry names an env var in `credentialEnv`; this service
  # resolves it from its own environment at sync time, so the API key stays in a Secret here and
  # the repo holds only which env to read.
  gitops:
    enabled: ${GITOPS_ENABLED:false}
    repo: ${GITOPS_REPO:}                        # owner/name, e.g. miguelperezcolom/ia-config
    branch: ${GITOPS_BRANCH:main}
    path: ${GITOPS_PATH:ia}                       # the directory in the repo that holds the YAML
    token: ${GITOPS_GITHUB_TOKEN:}               # a GitHub token with read access, from a Secret
    webhook-secret: ${GITOPS_WEBHOOK_SECRET:}    # HMAC shared secret; blank verifies nothing
    sync-on-startup: ${GITOPS_SYNC_ON_STARTUP:true}  # reconcile once at boot to converge on the repo
    poll-enabled: ${GITOPS_POLL_ENABLED:false}   # off: console edits survive until a real push
    poll-interval-ms: ${GITOPS_POLL_MS:300000}   # only used when poll-enabled — every 5 min
    api-base: ${GITOPS_API_BASE:https://api.github.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
