# nginx for the documentation site: static files only, unprivileged.
#
# Everything nginx writes goes under /tmp (an emptyDir in the pod), so the root filesystem can stay
# read-only and the process runs as the image's nginx user (101) on 8080. Access control is not
# here: the Ingress in front asks for a username and password (deploy/manifests/81-docs.yaml).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Behind the ingress: a redirect (a route without its trailing slash) must not name this
        # pod's host and port, only the path.
        absolute_redirect off;

        # Astro writes every page as <route>/index.html; a route without the slash finds it too.
        location / {
            try_files $uri $uri/ $uri/index.html =404;
            # Pages change with every build: always revalidate.
            add_header Cache-Control "no-cache";
        }

        # Hashed by the build (the file name changes when the content does): cache for good.
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The search index is rebuilt with the pages; cache it briefly.
        location /pagefind/ {
            add_header Cache-Control "public, max-age=300";
        }

        # For the kubelet's probes, which the Ingress's basic auth never sees.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        error_page 404 /404.html;
    }
}
