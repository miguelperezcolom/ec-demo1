server:
  port: 8125

spring:
  application:
    name: ec-demo1-communication

  ai:
    mcp:
      server:
        name: communication
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    function:
      definition: consumeNotifications;consumeResolutions;consumeHumanTasks
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
      bindings:
        consumeNotifications-in-0:
          destination: notifications
          group: ec-demo1-communication
        # What the notifications asked for is no longer waiting: closes them in every inbox.
        consumeResolutions-in-0:
          destination: notification-resolutions
          group: ec-demo1-communication
        # The forms engine's human tasks (EventConductor's HumanTaskChanged): one more inbox item.
        consumeHumanTasks-in-0:
          destination: ${HUMAN_TASKS_TOPIC:human-tasks}
          group: ec-demo1-communication

  # The cluster's send-only relay (deploy/manifests/11-postfix.yaml): plain SMTP inside the
  # namespace, no auth, no TLS; postfix relays onwards.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/communication}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

communication:
  from: ${MAIL_FROM:integration@ec1.mateu.io}
  default-email: ${DEFAULT_RECIPIENT:integration-admins@example.com}
  max-attempts: 5
  inbox:
    # The roles whose inbox a notification goes to, unless its type names its own below.
    default-roles: ${INBOX_DEFAULT_ROLES:ai-admin}
    # roles:
    #   CAUSE_OPENED: [mapping-admin]
    # Everything goes to the inbox; these are also emailed.
    urgent: ${INBOX_URGENT:PMS_REJECTED,RETRYING_TOO_LONG}
    tasks-link: ${INBOX_TASKS_LINK:/forms/tasks}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
