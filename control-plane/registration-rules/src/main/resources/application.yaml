server:
  port: 8132

spring:
  application:
    name: ec-demo1-registration-rules

  ai:
    mcp:
      server:
        name: registration-rules
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    stream:
      kafka:
        binder:
          # Records sent carry the trace they were sent in.
          enable-observation: true
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
        bindings:
          # Synchronous, so the relay marks a message published only once the broker acknowledged it;
          # keyed by the scope (COUNTRY:ES, HOTEL:MRU01), as a String.
          ruleEvents:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          auditEvents:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        # OUT, via the outbox relay: every rule, whole, on registration-rules — the front office keeps its copy.
        ruleEvents:
          destination: registration-rules
        # OUT: who changed a rule (F016), as the other control-plane services say it.
        auditEvents:
          destination: audit

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/registration_rules}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

registration:
  # The country of each CRS hotel — where a COUNTRY rule applies. Not in any master yet (the CRS's
  # catalogue has no country): until one has it, it is said here, and in each front office.
  hotel-countries: ${HOTEL_COUNTRIES:MRU01=MU,PMI01=ES,CUN01=MX}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
