server:
  port: 8125

spring:
  application:
    name: ec-demo1-communication

  ai:
    mcp:
      server:
        name: communication
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    function:
      # consumeWorkerEvent: the engine's tasks (worker-kafka) — the demo's reset, worker.CommunicationTasks.
      definition: consumeNotifications;consumeResolutions;consumeHumanTasks;consumeWorkerEvent
    stream:
      kafka:
        binder:
          # Consumers continue the trace their record carries; records sent carry the trace they were sent in.
          enable-observation: true
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
      bindings:
        consumeNotifications-in-0:
          destination: notifications
          group: ec-demo1-communication
        # What the notifications asked for is no longer waiting: closes them in every inbox.
        consumeResolutions-in-0:
          destination: notification-resolutions
          group: ec-demo1-communication
        # The forms engine's human tasks (EventConductor's HumanTaskChanged): one more inbox item.
        consumeHumanTasks-in-0:
          destination: ${HUMAN_TASKS_TOPIC:human-tasks}
          group: ec-demo1-communication
        # IN: the engine's tasks for this service — the step of reset-demo that names the topic
        # communication. Never paused by the reset it runs (demo-reset keeps it); the three above are.
        consumeWorkerEvent-in-0:
          destination: communication
          group: ec-demo1-communication-worker
        # OUT: the replies to the engine.
        upstream:
          destination: upstream

  # The cluster's send-only relay (deploy/manifests/11-postfix.yaml): plain SMTP inside the
  # namespace, no auth, no TLS; postfix relays onwards.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/communication}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

# Who hears of what, and where, is the recipients table (Notifications → Recipients) and nothing
# here: this is only how to reach people. An empty table is seeded with what used to be configured —
# the ai-admin role's inbox and browsers, both chat spaces, and the urgent ones e-mailed to
# default-email (RecipientDefaults).
communication:
  from: ${MAIL_FROM:integration@ec1.mateu.io}
  default-email: ${DEFAULT_RECIPIENT:integration-admins@example.com}
  max-attempts: 5
  inbox:
    tasks-link: ${INBOX_TASKS_LINK:/forms/tasks}
    # Whose a form's tasks are when the forms engine announces no roles (before EventConductor stores
    # them with JPA): reset-demo's confirmation is the administrators'.
    task-roles: ${INBOX_TASK_ROLES:confirmar-reset-demo=ai-admin}
  # The Google Chat spaces a recipient can post to, numbered 1 and 2 in this order (their incoming
  # webhooks, from a Secret; blank ones are left out).
  chat:
    webhooks: ${GOOGLE_CHAT_WEBHOOK:},${GOOGLE_CHAT_WEBHOOK_2:}
  # Web Push, to the browsers that allowed notifications (VAPID keys from a Secret; without them, no
  # browser is notified).
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:integration@ec1.mateu.io}
    # The front office's host: its browsers are the front desk's (FRONT_DESK_PUSH), not the consoles'.
    front-desk-hosts: ${FRONT_OFFICE_HOST:front.ec1.mateu.io}

management:
  # Traces to Tempo, as the engine's. Sampled at 0 unless TRACING_SAMPLING says otherwise (1.0 in
  # the cluster); the service name comes from OTEL_SERVICE_NAME, set in the manifest.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
