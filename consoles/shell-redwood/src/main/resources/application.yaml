server:
  port: 8102

spring:
  application:
    name: ec-demo1-shell
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys over the cluster network, so this pod's startup does not depend on its own
          # ingress, on public DNS, or on a certificate having been issued yet.
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/ec-demo1/protocol/openid-connect/certs}
          # The issuer as it appears in the token — the public URL. Setting both properties means
          # Spring validates the issuer while taking the keys from jwk-set-uri, and never performs
          # OIDC discovery at startup.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.ec1.mateu.io/realms/ec-demo1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
