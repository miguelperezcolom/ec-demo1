server:
  port: 8131

spring:
  application:
    name: ec-demo1-notices

  ai:
    mcp:
      server:
        name: notices
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    function:
      # The customers' notices, as the MDM sends them (Salesforce is their master).
      definition: consumeCustomerNotices
    stream:
      kafka:
        binder:
          # Consumers continue the trace their record carries; records sent carry the trace they were sent in.
          enable-observation: true
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
        bindings:
          # Synchronous, so the relay marks a message published only once the broker acknowledged it;
          # keyed by the subject (RESERVATION:12E45), as a String.
          noticeEvents:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
          # From the beginning the first time: the customers' notices the MDM already published are
          # this service's to take, and to hand on to the front office.
          consumeCustomerNotices-in-0:
            consumer:
              start-offset: earliest
      bindings:
        # OUT, via the outbox relay: every notice, whole, on notices — the front office keeps its copy.
        noticeEvents:
          destination: notices
        # IN: customer-notices, the MDM's; kept and published again on notices, once each (inbox).
        consumeCustomerNotices-in-0:
          destination: customer-notices
          group: ec-demo1-notices-customer-notices
          consumer:
            max-attempts: 1000
            back-off-initial-interval: 1000
            back-off-max-interval: 60000

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/notices}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

notices:
  # The master of partners: a partner notice carries the partner's name, as the PMS names the agency.
  erp-url: ${ERP_URL:http://localhost:8120}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
