server:
  port: 8120

spring:
  application:
    name: ec-demo1-partners

  ai:
    mcp:
      server:
        name: partners
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # the MCP server talks SSE, and those connections must not expire

  cloud:
    function:
      # Nothing consumed: this service only publishes, through its outbox.
      definition: ""
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9192}
          auto-create-topics: true
        bindings:
          # Synchronous, so the relay marks a message published only once the broker acknowledged
          # it; keyed by partner code, as a String.
          partnerEvents:
            producer:
              sync: true
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        # OUT, via the outbox relay: partner-changed, for whoever integrates with this master.
        partnerEvents:
          destination: partners

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/partners}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

springdoc:
  packages-to-scan: io.mateu.ecdemo1.partners.infra.in.rest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
